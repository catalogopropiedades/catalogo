const $=s=>document.querySelector(s);let city='';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const refTxt=r=>/^\d/.test(r)?'Ref. '+r:'Sin ref.';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
const cities=[...new Set(D.map(d=>d.city))];
$('#chips').innerHTML=`<button class="chip" data-c="" aria-pressed="true">Todas<span>${D.length}</span></button>`+cities.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="false">${esc(c)}<span>${D.filter(d=>d.city==c).length}</span></button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;city=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
$('#q').oninput=render;$('#tipo').onchange=render;
function render(){
 const q=$('#q').value.trim().toLowerCase(),t=$('#tipo').value;
 const f=D.filter(d=>(!city||d.city==city)&&(!t||d.tipo==t)&&(!q||[d.city,d.ref,d.title,d.price,d.tipo].join(' ').toLowerCase().includes(q)));
 $('#n').textContent=f.length+' de '+D.length+' flyers';
 if(!f.length){$('#list').innerHTML='<p class="empty">No hay flyers con ese filtro.</p>';return}
 let h='';for(const c of cities){const g=f.filter(d=>d.city==c);if(!g.length)continue;
  h+=`<h2>${esc(c)}<small>${g.length}</small></h2><div class="grid">`+g.map(d=>`<article class="card">
<button class="pic" data-s="${d.slug}" aria-label="Ver flyer ${esc(d.title)}"><img loading="lazy" src="min/${d.slug}.jpg" alt="${esc(d.title)}"></button>
<div class="body"><div class="ref">${refTxt(d.ref)} <span>· ${esc(d.tipo)}${d.ver?" · "+esc(d.ver):""}</span></div><h3>${esc(d.title)}</h3><div class="price">${esc(d.price)}</div>
<div class="acts"><a class="act main" href="img/${d.slug}.jpg" download="Flyer ${d.slug}.jpg">Descargar</a><button class="act" data-sh="${d.slug}">Compartir</button>${d.cap?`<button class="act" data-cp="${d.slug}">Copiar texto</button>`:''}</div></div></article>`).join('')+'</div>'}
 $('#list').innerHTML=h}
const bySlug=s=>D.find(d=>d.slug==s);
async function share(s){const d=bySlug(s);try{const b=await (await fetch('img/'+s+'.jpg')).blob();const file=new File([b],'Flyer '+s+'.jpg',{type:'image/jpeg'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:d.cap||''});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href='img/'+s+'.jpg';a.download='Flyer '+s+'.jpg';a.click();toast('Descargado: compartilo desde tu galería')}
async function copy(s){try{await navigator.clipboard.writeText(bySlug(s).cap);toast('Texto copiado')}catch(e){toast('No se pudo copiar')}}
let cur='';
document.addEventListener('click',e=>{const p=e.target.closest('[data-s]'),sh=e.target.closest('[data-sh]'),cp=e.target.closest('[data-cp]');
 if(p){cur=p.dataset.s;$('#dimg').src='img/'+cur+'.jpg';$('#ddl').href='img/'+cur+'.jpg';$('#ddl').download='Flyer '+cur+'.jpg';$('#dlg').showModal()}
 if(sh)share(sh.dataset.sh);if(cp)copy(cp.dataset.cp)});
$('#dsh').onclick=()=>share(cur);$('#dx').onclick=()=>$('#dlg').close();
$('#dlg').onclick=e=>{if(e.target===$('#dlg'))$('#dlg').close()};
render();
</script></body></html>
